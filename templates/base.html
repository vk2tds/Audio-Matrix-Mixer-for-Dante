<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dante Web{% endblock %}</title>
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("dante-web-theme") || "light");
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
  <header class="topbar">
    <h1>Dante Web</h1>
    <nav class="tabs">
      <a href="/">Devices</a>
      <a href="/routing">Routing</a>
      <a href="/connections">Connections</a>
      <a href="/gain">Gain</a>
      <a href="/metering">Metering</a>
      <a href="/presets">Presets</a>
      <a href="/config">Config</a>
      <a href="/flows">Flows</a>
      <a href="/activity">Activity</a>
      <a href="/design">Design</a>
      <a href="/panel">Panel</a>
    </nav>
    <div class="conn">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">connecting…</span>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
